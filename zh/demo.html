  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* HERO */

    .hero p { font-size: 20px; color: #64748b; max-width: 600px; margin: 0 auto 40px; line-height: 1.6; }

    /* FEATURES */
    .section { padding: 80px 40px; max-width: 1200px; margin: 0 auto; }
    .section-label { text-align: center; font-size: 13px; font-weight: 600; color: #2563eb; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 12px; }
    .section-title { text-align: center; font-size: clamp(28px, 4vw, 40px); font-weight: 800; margin-bottom: 16px; }
    .section-subtitle { text-align: center; font-size: 18px; color: #64748b; max-width: 600px; margin: 0 auto 64px; }
    .features-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px; }
    .video-wrap { position: relative; width: 100%; max-width: 900px; margin: 0 auto; aspect-ratio: 16 / 9; border-radius: 16px; overflow: hidden; box-shadow: 0 16px 48px rgba(15,23,42,0.16); border: 1px solid #e2e8f0; }
    .video-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    .feature-card { background: #f8fafc; border-radius: 16px; padding: 32px; border: 1px solid #e2e8f0; transition: all 0.2s; }
    .feature-card:hover { border-color: #2563eb; transform: translateY(-2px); box-shadow: 0 8px 24px rgba(37,99,235,0.1); }
    .feature-icon { font-size: 36px; margin-bottom: 16px; }
    .feature-card h3 { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
    .feature-card p { font-size: 14px; color: #64748b; line-height: 1.6; }
    .feature-badge { display: inline-block; background: #faf5ff; color: #7c3aed; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; margin-top: 12px; border: 1px solid #e9d5ff; }

    /* HOW IT WORKS */
    .how-section { background: #f8fafc; padding: 80px 40px; }
    .steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 32px; max-width: 1200px; margin: 0 auto; }
    .step { text-align: center; }
    .step-number { width: 56px; height: 56px; background: #2563eb; color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 800; margin: 0 auto 20px; }
    .step h3 { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
    .step p { font-size: 14px; color: #64748b; line-height: 1.6; }

    /* PRICING */
    /* Five plans on one row on a desktop. auto-fit with a 250px floor dropped WMS Cloud
       to a second line, which read as an afterthought rather than the top of the range.
       Fixed five columns, a wider container and tighter padding keep them level; the
       media queries below step down to 3, then 2, then 1 as the screen narrows. */
    .pricing-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 18px; max-width: 1600px; margin: 0 auto; align-items: stretch; }
    .pricing-card { border-radius: 16px; padding: 28px 22px; border: 2px solid #e2e8f0; position: relative; display: flex; flex-direction: column; }
    @media (max-width: 1560px) { .pricing-grid { grid-template-columns: repeat(3, 1fr); max-width: 1100px; } }
    @media (max-width: 1000px) { .pricing-grid { grid-template-columns: repeat(2, 1fr); max-width: 760px; } }
    @media (max-width: 700px)  { .pricing-grid { grid-template-columns: 1fr; max-width: 420px; } }
    .pricing-card.popular { border-color: #2563eb; background: #eff6ff; }
    .pricing-card.plus { border-color: #0d9488; background: #f0fdfa; }
    .pricing-card.pro { border-color: #9333ea; background: #faf5ff; }
    .pricing-card.enterprise { border-color: #EAB308; background: #fefce8; }
    .pricing-badge { position: absolute; top: -14px; left: 50%; transform: translateX(-50%); background: #2563eb; color: #fff; padding: 4px 16px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap; }
    .pricing-badge.plus { background: #0d9488; }
    .pricing-badge.pro { background: #9333ea; }
    .pricing-badge.enterprise { background: #EAB308; color: #1e293b; }
    .pricing-card h3 { font-size: 20px; font-weight: 800; margin-bottom: 8px; }
    /* Fixed heights per zone so the feature lists all start on the same line. Without
       them WMS Cloud (no price) and Free (no annual line) shift everything up. */
    .price { font-size: 42px; font-weight: 800; margin: 16px 0 4px; min-height: 56px; }
    .price span { font-size: 16px; font-weight: 500; color: #64748b; }
    .price-note { font-size: 13px; color: #64748b; margin: -2px 0 14px; min-height: 18px; }
    .pricing-desc { font-size: 13px; color: #64748b; margin-bottom: 20px; line-height: 1.45; min-height: 56px; }
    .pricing-features { list-style: none; margin-bottom: 24px; flex: 1; }
    .pricing-features li { font-size: 13px; padding: 5px 0; line-height: 1.4; border-bottom: 1px solid rgba(0,0,0,0.05); display: flex; align-items: center; gap: 8px; }
    .pricing-features li:last-child { border-bottom: none; }
    .btn-plan { display: block; text-align: center; padding: 14px; border-radius: 10px; font-size: 15px; font-weight: 700; text-decoration: none; transition: all 0.2s; margin-top: auto; }
    .btn-plan.basic { background: #2563eb; color: #fff; }
    .btn-plan.basic:hover { background: #1d4ed8; }
    .btn-plan.pro { background: #9333ea; color: #fff; }
    .btn-plan.pro:hover { background: #7c3aed; }
    .btn-plan.enterprise { background: #EAB308; color: #1e293b; }
    .btn-plan.enterprise:hover { background: #ca8a04; }

    /* FAQ */

    .faq-item p { font-size: 14px; color: #64748b; line-height: 1.6; }
